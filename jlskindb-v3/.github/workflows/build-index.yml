name: Build index files

on:
  push:
    branches: [main]
    paths:
      - 'cards/**'
      - 'tl/**'
      - 'scripts/build-index.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so "date added" comes from git

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate cards/index.json and tl/index.json
        run: node scripts/build-index.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards/index.json tl/index.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: rebuild index files [skip ci]" && git push
